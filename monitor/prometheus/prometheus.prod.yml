# 운영 환경용 Prometheus 설정
# Alloy 가 remote_write 로 메트릭 전송 — 여기서는 scrape_configs 없음
# docker-compose.prod.yml 에서 이 파일로 교체됨

global:
  evaluation_interval: 30s
  external_labels:
    environment: prod
    region: ap-northeast-2

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
      timeout: 10s
