global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    environment: local
    region: ap-northeast-2

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # 전체 메트릭 수집: 대시보드 상세 분석용 (10분 주기)
  - job_name: moni-services
    scrape_interval: 600s
    metrics_path: /actuator/prometheus
    eureka_sd_configs:
      - server: 'http://${SERVICE_PRIVATE_IP}:${EUREKA_PORT}/eureka'
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__meta_eureka_app_name]
        target_label: application
        action: lowercase
      - source_labels: [__meta_eureka_app_instance_id]
        target_label: instance

  # 헬스 감시: 30초 주기, up 지표만 유지 (실제 메트릭은 전부 drop)
  - job_name: moni-health
    scrape_interval: 30s
    metrics_path: /actuator/prometheus
    eureka_sd_configs:
      - server: 'http://${SERVICE_PRIVATE_IP}:${EUREKA_PORT}/eureka'
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__meta_eureka_app_name]
        target_label: application
        action: lowercase
      - source_labels: [__meta_eureka_app_instance_id]
        target_label: instance
    metric_relabel_configs:
      # 수집한 메트릭 전부 drop — Prometheus 내부 up 지표는 이 단계 전에 생성되므로 보존됨
      - source_labels: [__name__]
        regex: '.*'
        action: drop

  # 에러율·레이턴시 신호: 1분 주기, 핵심 HTTP·DB 메트릭만 보존
  - job_name: moni-signals
    scrape_interval: 60s
    metrics_path: /actuator/prometheus
    eureka_sd_configs:
      - server: 'http://${SERVICE_PRIVATE_IP}:${EUREKA_PORT}/eureka'
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__meta_eureka_app_name]
        target_label: application
        action: lowercase
      - source_labels: [__meta_eureka_app_instance_id]
        target_label: instance
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'http_server_requests_seconds_(bucket|count|sum)'
        action: keep
      - source_labels: [__name__]
        regex: 'hikaricp_connections_(active|pending|max|min)'
        action: keep

  # JVM·CPU 메트릭: 5분 주기
  - job_name: moni-jvm
    scrape_interval: 300s
    metrics_path: /actuator/prometheus
    eureka_sd_configs:
      - server: 'http://${SERVICE_PRIVATE_IP}:${EUREKA_PORT}/eureka'
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__meta_eureka_app_name]
        target_label: application
        action: lowercase
      - source_labels: [__meta_eureka_app_instance_id]
        target_label: instance
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'jvm_memory_(used|max|committed)_bytes'
        action: keep
      - source_labels: [__name__]
        regex: 'jvm_gc_pause_seconds_(bucket|count|sum)'
        action: keep
      - source_labels: [__name__]
        regex: 'jvm_threads_(live|daemon|peak)_threads'
        action: keep
      - source_labels: [__name__]
        regex: 'process_cpu_usage'
        action: keep

  # EC2 서버 자체 리소스 (node-exporter 필요)
  - job_name: node-exporter
    scrape_interval: 30s
    static_configs:
      - targets: ['${SERVICE_PRIVATE_IP}:${NODE_EXPORTER_PORT}']
        labels:
          instance_name: server-ec2
      - targets: ['${INFRA_PRIVATE_IP}:${NODE_EXPORTER_PORT}']
        labels:
          instance_name: infra-ec2

  # Kafka Consumer Lag (kafka-exporter 필요)
  - job_name: kafka
    scrape_interval: 30s
    static_configs:
      - targets: ['${INFRA_PRIVATE_IP}:${KAFKA_EXPORTER_PORT}']
        labels:
          service: kafka

  # PostgreSQL (postgres-exporter 필요)
  - job_name: postgresql
    scrape_interval: 30s
    static_configs:
      - targets: ['${INFRA_PRIVATE_IP}:${PG_EXPORTER_PORT}']
        labels:
          service: postgresql

  # 모니터링 스택 자체 감시
  - job_name: monitor-stack
    scrape_interval: 30s
    static_configs:
      - targets:
          - 'prometheus:9090'
          - 'loki:3100'
          - 'tempo:3200'
          - 'grafana:3000'
          - 'alertmanager:9093'
