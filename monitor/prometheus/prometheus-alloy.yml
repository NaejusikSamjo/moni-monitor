# Alloy 모드용 Prometheus 설정
# scrape_configs 없음 — Alloy 가 remote_write 로 메트릭 전송
# Prometheus 역할: 저장(tsdb) + 알람 룰 평가 + Alertmanager 연동

global:
  evaluation_interval: 30s
  external_labels:
    environment: local
    region: ap-northeast-2

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
