server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: moni-services
    static_configs:
      - targets:
          - localhost
        labels:
          job: moni
          __path__: /var/log/services/**/*.log
    relabel_configs:
      # 파일 경로에서 서비스 이름 추출: /var/log/services/<service>/<service>.log
      - source_labels: [__path__]
        regex: '/var/log/services/([^/]+)/.*'
        target_label: service
        replacement: '$1'
    pipeline_stages:
      - json:
          expressions:
            level: level
      - labels:
          level:
      # INFO / DEBUG / TRACE 로그 drop → ERROR / WARN 만 Loki에 저장
      - drop:
          source: level
          expression: "(?i)^(info|debug|trace)$"
