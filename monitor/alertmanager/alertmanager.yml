global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'application', 'instance_name']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: discord-default

  routes:
    - match:
        severity: critical
      receiver: discord-critical
      repeat_interval: 1h

receivers:

  - name: discord-default
    webhook_configs:
      # AlertManager → 변환기 → Discord
      - url: 'http://discord-webhook:9094'
        send_resolved: true

  - name: discord-critical
    webhook_configs:
      - url: 'http://discord-webhook-critical:9094'
        send_resolved: true

inhibit_rules:
  # critical 발생 시 같은 서비스의 warning 억제
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ['application', 'instance_name']