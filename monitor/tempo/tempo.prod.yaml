server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  trace_idle_period: 10s
  max_block_bytes: 1_000_000
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 168h    # 운영: 7일 보존

metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write

storage:
  trace:
    backend: s3
    s3:
      bucket: ${TEMPO_S3_BUCKET}
      endpoint: s3.${AWS_REGION}.amazonaws.com
      region: ${AWS_REGION}
      access_key: ${AWS_ACCESS_KEY_ID}
      secret_key: ${AWS_SECRET_ACCESS_KEY}
      insecure: false
    wal:
      path: /var/tempo/wal    # WAL은 로컬 유지 (충돌 복구용)
    pool:
      max_workers: 100
      queue_depth: 10000

# Tail-based sampling policy
# 에러가 있는 트레이스 100%, 지연 > 1000ms 트레이스 100%, 나머지 10%
overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]

# Tail Sampling 정책 (OTel Collector 없이 Tempo 자체 적용 시)
# 참고: https://grafana.com/docs/tempo/latest/configuration/#tail-based-sampling
# 아래 설정은 Tempo 자체 tail-sampling 활성화 시 사용
# tail_sampling:
#   decision_wait: 30s
#   num_traces: 50000
#   policies:
#     - name: error-policy
#       type: status_code
#       status_code:
#         status_codes: [ERROR]
#     - name: slow-traces
#       type: latency
#       latency:
#         threshold_ms: 1000
#     - name: probabilistic-policy
#       type: probabilistic
#       probabilistic:
#         sampling_percentage: 10
