name: CI

on:
  pull_request:
    branches: [develop, main]

jobs:
  validate:
    runs-on: ubuntu-latest

    env:
      COMMIT_MSG: ${{ github.event.pull_request.title }}
      BRANCH: ${{ github.head_ref }}
      COMMIT_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Notify start
        uses: ./.github/actions/discord-notify
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          title: "모니터링 CI 시작"
          color: 3447003
          message: ${{ env.COMMIT_MSG }}
          branch: ${{ env.BRANCH }}
          sha: ${{ env.COMMIT_SHA }}

      - name: Validate YAML configs
        run: |
          pip install -q pyyaml
          python3 - <<'EOF'
          import yaml, glob, sys
          files = glob.glob("monitor/**/*.yml", recursive=True) + \
                  glob.glob("monitor/**/*.yaml", recursive=True)
          errors = []
          for f in files:
              try:
                  yaml.safe_load(open(f))
              except yaml.YAMLError as e:
                  errors.append(f"{f}: {e}")
          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print(f"OK: {len(files)} files validated")
          EOF

      - name: Notify success
        if: success()
        uses: ./.github/actions/discord-notify
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          title: "모니터링 CI 성공"
          color: 5763719
          message: ${{ env.COMMIT_MSG }}
          branch: ${{ env.BRANCH }}
          sha: ${{ env.COMMIT_SHA }}

      - name: Notify failure
        if: failure()
        uses: ./.github/actions/discord-notify
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          title: "모니터링 CI 실패"
          color: 15548997
          message: ${{ env.COMMIT_MSG }}
          branch: ${{ env.BRANCH }}
          sha: ${{ env.COMMIT_SHA }}
