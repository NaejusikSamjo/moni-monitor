networks:
  default:
    name: moni-network
    external: true

volumes:
  loki_data:
  tempo_data:
  prometheus_data:
  grafana_data:

services:

  # ── Loki: S3 백엔드 ──────────────────────────────────────────────────────────
  loki:
    image: grafana/loki:3.3.2
    command: ["-config.file=/etc/loki/local-config.yaml", "-config.expand-env=true"]
    volumes:
      - ./monitor/loki/loki.prod.yaml:/etc/loki/local-config.yaml
      - loki_data:/loki
    environment:
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      LOKI_S3_BUCKET: ${LOKI_S3_BUCKET}
      LOKI_S3_PREFIX: ${LOKI_S3_PREFIX}

  # ── Tempo: S3 백엔드 + 운영 WAL 경로 ─────────────────────────────────────────
  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml", "-config.expand-env=true"]
    volumes:
      - ./monitor/tempo/tempo.prod.yaml:/etc/tempo.yaml
      - tempo_data:/var/tempo
    environment:
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      TEMPO_S3_BUCKET: ${TEMPO_S3_BUCKET}
      TEMPO_S3_PREFIX: ${TEMPO_S3_PREFIX}

  # ── Alloy: 운영 config (monitoring-ec2 — 메트릭 수집 전담) ──────────────────
  # 로그 수집은 service-ec2의 docker-compose.alloy.yml 사이드카가 담당
  alloy:
    image: grafana/alloy:latest
    volumes:
      - ./monitor/alloy/config.prod.alloy:/etc/alloy/config.alloy:ro
    environment:
      PROMETHEUS_REMOTE_WRITE_URL: http://prometheus:9090/api/v1/write
      SERVICE_PRIVATE_IP: ${SERVICE_PRIVATE_IP}
      INFRA_PRIVATE_IP: ${INFRA_PRIVATE_IP}

  # ── Prometheus: 운영 보존 기간 30일 ──────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.12.0
    volumes:
      - ./monitor/prometheus/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitor/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    entrypoint:
      - /bin/sh
      - -c
      - |
        exec /bin/prometheus \
          --config.file=/etc/prometheus/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --storage.tsdb.retention.time=30d \
          --web.enable-lifecycle \
          --web.enable-remote-write-receiver
  # ── Grafana: Okta SSO, 로그인 폼 비활성화 ────────────────────────────────────
  grafana:
    image: grafana/grafana:13.1.0
    environment:
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
      GF_SECURITY_ADMIN_USER: ""
      GF_SECURITY_ADMIN_PASSWORD: ""
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL}
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: "Okta"
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: ${OKTA_GRAFANA_CLIENT_ID}
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${OKTA_GRAFANA_CLIENT_SECRET}
      GF_AUTH_GENERIC_OAUTH_SCOPES: "openid profile email"
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: ${OKTA_GRAFANA_ISSUER_URI}/v1/authorize
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: ${OKTA_GRAFANA_ISSUER_URI}/v1/token
      GF_AUTH_GENERIC_OAUTH_API_URL: ${OKTA_GRAFANA_ISSUER_URI}/v1/userinfo
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(groups[*], 'moni-admin') && 'Admin' || 'Editor'"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: "false"
      GF_EXPLORE_ENABLED: "true"
      GF_AUTH_SIGNOUT_REDIRECT_URL: ${OKTA_GRAFANA_ISSUER_URI}/v1/logout?post_logout_redirect_uri=${GRAFANA_ROOT_URL}&client_id=${OKTA_GRAFANA_CLIENT_ID}
    ports:
      - "${GRAFANA_PORT:-3000}:3000"

  # ── PostgreSQL exporters: DB별 독립 인스턴스 (포트 25432~25438) ──────────────
  postgres-exporter:
    environment:
      DATA_SOURCE_NAME: "postgresql://${PG_EXPORTER_USER}:${PG_EXPORTER_PASSWORD}@${INFRA_PRIVATE_IP}:${USER_DB_PORT:-25432}/user_db?sslmode=disable"

  postgres-exporter-portfolio:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    container_name: moni-pg-exporter-portfolio
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${PG_EXPORTER_USER}:${PG_EXPORTER_PASSWORD}@${INFRA_PRIVATE_IP}:${PORTFOLIO_DB_PORT:-25433}/portfolio_db?sslmode=disable"
    ports:
      - "127.0.0.1:9188:9187"

  postgres-exporter-stock:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    container_name: moni-pg-exporter-stock
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${PG_EXPORTER_USER}:${PG_EXPORTER_PASSWORD}@${INFRA_PRIVATE_IP}:${STOCK_DB_PORT:-25434}/stock_db?sslmode=disable"
    ports:
      - "127.0.0.1:9189:9187"

  postgres-exporter-notification:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    container_name: moni-pg-exporter-notification
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${PG_EXPORTER_USER}:${PG_EXPORTER_PASSWORD}@${INFRA_PRIVATE_IP}:${NOTIFICATION_DB_PORT:-25435}/notification_db?sslmode=disable"
    ports:
      - "127.0.0.1:9190:9187"

  postgres-exporter-trade:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    container_name: moni-pg-exporter-trade
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${PG_EXPORTER_USER}:${PG_EXPORTER_PASSWORD}@${INFRA_PRIVATE_IP}:${TRADE_DB_PORT:-25436}/trade_db?sslmode=disable"
    ports:
      - "127.0.0.1:9191:9187"

  postgres-exporter-payment:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    container_name: moni-pg-exporter-payment
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${PG_EXPORTER_USER}:${PG_EXPORTER_PASSWORD}@${INFRA_PRIVATE_IP}:${PAYMENT_DB_PORT:-25437}/payment_db?sslmode=disable"
    ports:
      - "127.0.0.1:9192:9187"

  postgres-exporter-ai:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    container_name: moni-pg-exporter-ai
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${PG_EXPORTER_USER}:${PG_EXPORTER_PASSWORD}@${INFRA_PRIVATE_IP}:${AI_DB_PORT:-25438}/ai_db?sslmode=disable"
    ports:
      - "127.0.0.1:9193:9187"

  # ── Kafka exporter ────────────────────────────────────────────────────────────
  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: moni-kafka-exporter
    restart: unless-stopped
    command:
      - "--kafka.server=${INFRA_PRIVATE_IP}:${KAFKA_PORT:-9092}"
    ports:
      - "127.0.0.1:9308:9308"

  discord-webhook:
    image: benjojo/alertmanager-discord:latest
    environment:
      DISCORD_WEBHOOK: ${DISCORD_WEBHOOK_URL}

  discord-webhook-critical:
    image: benjojo/alertmanager-discord:latest
    environment:
      DISCORD_WEBHOOK: ${DISCORD_CRITICAL_WEBHOOK_URL}
